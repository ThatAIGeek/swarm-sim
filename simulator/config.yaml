# Стандартні умови моделювання симулятора swarm-sim (світова система: x — схід, y — північ, z — угору; метри).
#
# Інший файл без зміни цього: SWARM_SIM_CONFIG=мій.yaml swarm-sim …  (відсутні ключі беруться звідси).
# Дані варіантів (датасет, сценарії, еталонні числа) залежать від цих значень: після зміни їх треба перегенерувати.
# Значення нижче — відкалібровані для лабораторної роботи з імітаційного навчання контролера рою.

scenario:
  start:
    center: [0.0, 0.0]          # центр стартової області (x, y), м
    cube: [40.0, 40.0, 20.0]    # розмір стартової області (x, y, висота), м
    z0: 10.0                    # нижня межа стартової висоти, м (дрони стартують на z0 … z0 + cube[2])
    min_dist: 5.0               # мінімальна відстань між дронами на старті, м
    v0_max: 6.0                 # початкова швидкість кожного дрона 0 … v0_max у випадковому напрямку, м/с
  goal:
    distance: [150.0, 150.0]    # відстань від центру старту по горизонталі, м (від … до; однакові — рівно)
    height: [39.0, 39.0]        # висота цілі, м (від … до)
    azimuth_deg: null           # напрямок від старту на ціль, градуси від осі x (схід) проти годинникової;
                                # null — випадковий у кожному сценарії
    point: null                 # або фіксована точка [x, y, z], м — тоді distance / height / azimuth ігноруються
  wind:
    max: 6.0                    # постійний горизонтальний вітер 0 … max, м/с (у варіантах — свій max)
    gust_range: [0.5, 2.0]      # СКВ поривів, м/с (у варіантах верхня межа — своя)

episode:
  duration: 30.0                # тривалість епізоду, с (такти — duration / physics.dt; запис і пульт беруть звідси)

physics:
  dt: 0.05                      # крок, с (20 Гц)
  tau_v: 0.35                   # стала часу контуру швидкості, с
  kappa_w: 0.25                 # вплив вітру на прискорення, 1/с
  gust_tau: 1.0                 # кореляційний час поривів (процес Орнштейна–Уленбека), с
  k_yaw: 3.0                    # підсилення регулятора курсу, 1/с
  yaw_rate_max: 1.5             # макс. кутова швидкість курсу, рад/с
  crash_dist: 0.9               # зіткнення — ближче, м
  ground_z: 0.3                 # «земля», м
  zone_center: [0.0, 0.0]       # центр робочої зони (x, y), м
  zone_radius: 250.0            # радіус зони по горизонталі, м (далі — «втрачено»)
  z_max: 80.0                   # стеля зони, м
